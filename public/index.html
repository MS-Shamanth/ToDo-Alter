<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-page">
    <div class="auth-box">
        <h2>Todo App</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <p id="auth-error"></p>
        <button onclick="login()">Login</button>
        <button onclick="signup()">Sign Up</button>
    </div>
</div>

<div id="app-page" style="display:none">
    <div class="sidebar">
        <div class="user-row">
            <span id="user-display"></span>
            <span class="logout-icon" onclick="logout()" title="Logout">&#8618;</span>
        </div>
        <div class="label">MY LISTS</div>
        <ul id="lists"></ul>
        <div class="new-list" onclick="createList()">+&nbsp; New List</div>
    </div>
    <div class="main">
        <div id="empty-msg">Select or create a list to get started</div>
        <div id="list-view" style="display:none">
            <div class="list-header">
                <h1 id="list-name"></h1>
                <span class="pencil" onclick="renameList()">&#9998;</span>
                <button class="new-task-btn" onclick="showForm()">+ New Task</button>
            </div>
            <div id="share-bar" style="display:none"></div>
            <div id="task-form" style="display:none">
                <input type="text" id="inp-title" placeholder="Task name...">
                <input type="text" id="inp-tags" placeholder="Tags (comma separated)">
                <button onclick="addItem()">Add</button>
                <button class="cancel-btn" onclick="hideForm()">Cancel</button>
            </div>
            <div id="filter-bar" style="display:none"></div>
            <div id="items"></div>
        </div>
    </div>
    <div class="stats-panel">
        <div class="label">LIST STATISTICS</div>
        <div id="stats"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
